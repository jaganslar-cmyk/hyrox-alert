name: HYROX Bengaluru 2027 watcher

on:
  schedule:
    # Baseline cadence. NOTE: GitHub heavily throttles scheduled runs, so this
    # lands at roughly every ~2h regardless of the interval requested. That is
    # our Aug–early-Oct cadence and a permanent fallback. For TIGHT (~15 min)
    # cadence near the open date, an external scheduler (e.g. cron-job.org) pings
    # the repository_dispatch trigger below every 15 min during the tight window.
    - cron: "0 */2 * * *"
  repository_dispatch:
    types: [poll]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run detection only, do not send"
        type: boolean
        default: true

permissions:
  contents: write   # allow committing state.json back on a fire

concurrency:
  group: hyrox-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python watch.py --dry-run
          else
            python watch.py
          fi

      - name: Persist state only when the alert has fired
        if: always()
        run: |
          # Commit state.json ONLY once registration was detected (notified=true),
          # so we don't create a commit on every routine "not open" check.
          if grep -q '"notified": true' state.json; then
            if ! git diff --quiet -- state.json; then
              git config user.name "hyrox-watch-bot"
              git config user.email "bot@users.noreply.github.com"
              git add state.json
              git commit -m "state: registration detected, alert fired"
              git push
            fi
          fi
